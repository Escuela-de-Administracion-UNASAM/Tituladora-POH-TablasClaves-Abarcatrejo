<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tituladora-POH-TablasClaves · Administración FAT-UNASAM</title>
<meta name="description" content="Generador de título, problemas, objetivos, hipótesis, operacionalización, matriz de consistencia, metodología y modelo gráfico para tesis cuantitativas de Administración (UNASAM).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314305a'/%3E%3Cpath d='M9 10h14M16 10v13' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#14305a; --navy-2:#1d4479; --ink:#1b2333; --muted:#5d6779; --line:#dde2ea; --bg:#f4f6f9;
  --card:#ffffff; --accent:#b8892b; --accent-soft:#f7efdd; --ok:#1f7a4d; --ok-soft:#e5f3eb; --warn:#a15c07; --warn-soft:#fdf1e1;
  --err:#b42318; --radius:12px; --shadow:0 1px 2px rgba(20,48,90,.06),0 4px 16px rgba(20,48,90,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logos{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:5px 10px;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.logos img{height:36px;width:auto;display:block;object-fit:contain}
.lsep{width:1px;height:28px;background:#d5dbe4}
#themeSel{color:#fff;appearance:auto}
#themeSel option{color:#1b2333;background:#fff}
.credit a{color:var(--navy-2);font-weight:600;text-decoration:none}
.credit a:hover{text-decoration:underline}
/* Temas */
[data-theme="esmeralda"]{--navy:#0f4c3a;--navy-2:#16684f;--accent:#b8892b}
[data-theme="vino"]{--navy:#5a1d2e;--navy-2:#7a2a40;--accent:#c08a2d}
[data-theme="oscuro"]{--navy:#0f1b2d;--navy-2:#6ea8fe;--ink:#e6eaf1;--muted:#9aa6b8;--line:#2a3547;--bg:#0b1220;--card:#131c2c;--accent-soft:#3a2f17;--ok-soft:#173a2a;--warn-soft:#3a2a12;color-scheme:dark}
[data-theme="oscuro"] .inp,[data-theme="oscuro"] .choice,[data-theme="oscuro"] .topt,[data-theme="oscuro"] .icon-btn,[data-theme="oscuro"] .btn.sec,[data-theme="oscuro"] .stepper-wrap{background:#18233a;border-color:#2f3d55;color:var(--ink)}
[data-theme="oscuro"] .vblock,[data-theme="oscuro"] .kpi div,[data-theme="oscuro"] .formula,[data-theme="oscuro"] .ed:hover,[data-theme="oscuro"] .ed:focus,[data-theme="oscuro"] .topt.on{background:#1a2740}
[data-theme="oscuro"] label.f,[data-theme="oscuro"] .card h3,[data-theme="oscuro"] .step-head h2,[data-theme="oscuro"] .choice b,[data-theme="oscuro"] .poh-col h4,[data-theme="oscuro"] .mth h4,[data-theme="oscuro"] .kpi b{color:#dbe6f7}
[data-theme="oscuro"] .st.cur{color:#dbe6f7}[data-theme="oscuro"] .st .n{background:#22304a}
[data-theme="oscuro"] .tag{background:#22304a;color:#9cc2ff}
[data-theme="oscuro"] .alert.info{background:#14243d;color:#cfe0fb;border-color:#26406a}
[data-theme="oscuro"] .modal{background:#131c2c;color:var(--ink)}
[data-theme="oscuro"] .ed.mod{background:#2c2614;border-color:#5a4a1e}
[data-theme="oscuro"] .card[style]{background:var(--card)!important}
.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
.brand p{margin:0;font-size:12px;opacity:.8}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.save-state{font-size:12px;opacity:.85;margin-right:6px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-dot{width:8px;height:8px;border-radius:50%;background:#6ee7a8;transition:background .3s}
.save-dot.busy{background:#fcd34d}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s}
.hbtn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}

/* Stepper */
.stepper-wrap{background:#fff;border-bottom:1px solid var(--line)}
.stepper{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.st{flex:1 0 auto;display:flex;align-items:center;gap:8px;padding:12px 10px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;border-bottom:3px solid transparent;transition:color .2s,border-color .2s;white-space:nowrap}
.st .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:#eef1f5;color:var(--muted);transition:background .2s,color .2s}
.st.done .n{background:var(--ok-soft);color:var(--ok)}
.st.cur{color:var(--navy);border-bottom-color:var(--accent)}
.st.cur .n{background:var(--navy);color:#fff}
.st:disabled{cursor:not-allowed;opacity:.55}
.progress{height:3px;background:#eef1f5}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--navy-2),var(--accent));width:0;transition:width .45s cubic-bezier(.2,.7,.2,1)}

/* Layout */
main{max-width:1180px;margin:0 auto;padding:24px 20px 40px}
.step{animation:enter .32s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.step-head{margin-bottom:18px}
.step-head .kicker{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.8px}
.step-head h2{margin:2px 0 4px;font-size:22px;color:var(--navy)}
.step-head p{margin:0;color:var(--muted);max-width:760px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:16px;color:var(--navy)}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:860px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

/* Fields */
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:#2b3446}
.f small{font-weight:400;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid #cfd6e0;border-radius:8px;padding:9px 11px;background:#fff;transition:border-color .15s,box-shadow .15s;outline:none}
textarea.inp{resize:vertical;min-height:74px;line-height:1.45}
.inp:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(29,68,121,.14)}
.inp.bad{border-color:#e7a29b}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.row{display:flex;gap:10px;align-items:flex-end}
.row>.grow{flex:1}
.w-art{width:96px;flex:none}

/* Choice cards */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.choice{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;background:#fff;transition:border-color .2s,box-shadow .2s,transform .2s}
.choice:hover{border-color:#a9b7cc;transform:translateY(-1px)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(20,48,90,.1)}
.choice.on::after{content:"✓";position:absolute;top:12px;right:14px;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;display:grid;place-items:center}
.choice b{display:block;color:var(--navy);margin-bottom:3px;font-size:15px}
.choice span{font-size:13px;color:var(--muted)}
.choice.dis{opacity:.45;pointer-events:none}

/* Blocks for variables */
.vblock{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px;background:#fbfcfd}
.vblock-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#e8eef7;color:var(--navy-2);letter-spacing:.3px}
.tag.gold{background:var(--accent-soft);color:#7a5a14}
.tag.green{background:var(--ok-soft);color:var(--ok)}
.icon-btn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 9px;font-size:12.5px;cursor:pointer;color:var(--muted);transition:color .15s,border-color .15s}
.icon-btn:hover{color:var(--err);border-color:#f0b8b2}
.add-btn{margin-top:10px;border:1.5px dashed #b7c3d4;background:transparent;border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--navy-2);font-weight:600;font-size:13px;width:100%;transition:background .15s,border-color .15s}
.add-btn:hover{background:#f0f4fa;border-color:var(--navy-2)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid transparent;transition:background .15s,box-shadow .15s,transform .1s,border-color .15s}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-2);box-shadow:0 4px 12px rgba(20,48,90,.22)}
.btn.sec{background:#fff;color:var(--navy);border-color:#c9d2df}
.btn.sec:hover{border-color:var(--navy-2);background:#f6f8fb}
.btn.gold{background:var(--accent);color:#fff}
.btn.gold:hover{background:#a37823;box-shadow:0 4px 12px rgba(184,137,43,.3)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;flex-wrap:wrap}

/* Alerts */
.alert{border-radius:10px;padding:11px 14px;font-size:13.5px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--warn-soft);color:#6b3d04;border:1px solid #f3d6ae}
.alert.info{background:#eaf1fb;color:#1d3b63;border:1px solid #cbdaf0}
.alert.err{background:#fdecea;color:#7a1a12;border:1px solid #f4c3bd}
.alert ul{margin:4px 0 0;padding-left:18px}

/* Title options */
.topt{display:block;border:1.5px solid var(--line);border-radius:10px;padding:13px 15px 13px 44px;margin-bottom:10px;cursor:pointer;position:relative;background:#fff;transition:border-color .2s,background .2s}
.topt::before{content:"";position:absolute;left:15px;top:15px;width:16px;height:16px;border-radius:50%;border:2px solid #b6c1d1;transition:border .2s}
.topt.on{border-color:var(--navy);background:#f6f9fd}
.topt.on::before{border:5px solid var(--navy)}
.topt small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.topt div{font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chk{font-size:12px;padding:3px 9px;border-radius:20px;background:#f0f2f5;color:var(--muted)}
.chk.ok{background:var(--ok-soft);color:var(--ok)}
.chk.ok::before{content:"✓ "}

/* Editable statements */
.sec-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px}
.stm{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.stm .lbl{flex:none;min-width:44px;font-size:12px;font-weight:700;color:var(--navy-2);background:#eef3fa;border-radius:6px;padding:4px 6px;text-align:center;margin-top:6px}
.ed{flex:1;border:1px solid transparent;border-radius:8px;padding:6px 9px;transition:border-color .15s,background .15s;outline:none;cursor:text}
.ed:hover{border-color:var(--line);background:#fbfcfe}
.ed:focus{border-color:var(--navy-2);background:#fff;box-shadow:0 0 0 3px rgba(29,68,121,.12)}
.ed.mod{background:#fffaf0;border-color:#efd9a8}
.rst{flex:none;border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;margin-top:7px;visibility:hidden}
.stm.has-mod .rst{visibility:visible}
.poh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:1000px){.poh-grid{grid-template-columns:1fr}}
.poh-col h4{margin:0 0 4px;color:var(--navy);font-size:15px;display:flex;align-items:center;gap:8px}

/* Paper preview (APA) */
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;padding:28px 30px;font-family:"Times New Roman",Times,serif;font-size:15px;color:#111;overflow-x:auto}
.paper .tnum{font-weight:700;margin:0}
.paper .ttitle{font-style:italic;margin:2px 0 10px}
.paper .nota{margin-top:8px;font-size:14px}
table.apa{border-collapse:collapse;width:100%;min-width:640px}
table.apa th,table.apa td{padding:5px 7px;vertical-align:top;text-align:left;font-size:13.5px;line-height:1.35;border:0}
table.apa thead th{border-top:1.5px solid #111;border-bottom:1px solid #111;font-weight:700;text-align:center}
table.apa td.lb{border-bottom:1.5px solid #111}
table.apa td.sep{border-top:1px solid #cfcfcf}
.fig-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto;text-align:center}
.fig-box svg{max-width:100%;height:auto}
.fig-cap{font-family:"Times New Roman",serif;text-align:left;margin-bottom:8px}
.fig-cap b{display:block}
.fig-cap i{display:block}

/* Method */
.mth h4{margin:14px 0 4px;color:var(--navy);font-size:14.5px}
.formula{font-family:"Cambria Math","Times New Roman",serif;font-size:17px;text-align:center;padding:10px;background:#f7f9fc;border-radius:8px;margin:8px 0}
.kpi{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.kpi div{background:#f3f6fa;border-radius:10px;padding:10px 14px;min-width:120px}
.kpi b{display:block;font-size:22px;color:var(--navy)}
.kpi span{font-size:12px;color:var(--muted)}

/* Modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,45,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:85vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .25s cubic-bezier(.2,.7,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 6px;color:var(--navy)}
.refs p{margin:0 0 10px;padding-left:28px;text-indent:-28px;font-size:14px}
.refs .grp{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#14305a;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{max-width:1180px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
footer button{background:none;border:0;color:var(--navy-2);text-decoration:underline;cursor:pointer;padding:0;font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header.top,.stepper-wrap,.nav,footer,.btn-row{display:none}}
</style>
</head>

  for(const k of Object.keys(base)){ if(obj[k]!==undefined) base[k]=obj[k]; }

/* ============================================================
   UTILIDADES DE TEXTO (gramática española)
   ============================================================ */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = s => String(s||'').replace(/\s+/g,' ').trim().replace(/[.;,:]+$/,'');
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
const unacc = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function lowerFirst(s){
  s=clean(s); if(!s) return s;
  const w=s.split(' ')[0];
  if(w.length>1 && w===w.toUpperCase() && /[A-ZÁÉÍÓÚÑ]/.test(w)) return s; // sigla (TIC, MYPE)
  return s.charAt(0).toLowerCase()+s.slice(1);
}
const EXC = {clima:'m',sistema:'m',problema:'m',programa:'m',tema:'m',esquema:'m',idioma:'m',dia:'m',mapa:'m',planeta:'m',
  imagen:'f',mano:'f',red:'f',sede:'f',base:'f',clase:'f',fuente:'f',gente:'f',mente:'f',parte:'f',suerte:'f',ley:'f',labor:'f',
  mype:'f',pyme:'f',empresa:'f',estres:'m',analisis:'m',marketing:'m',branding:'m',engagement:'m',coaching:'m',e:'m',
  crisis:'f',sintesis:'f',tesis:'f',actitud:'f',salud:'f',calidad:'f',tic:'fp',tics:'fp',mypes:'fp',pymes:'fp'};
function genderSing(w){
  if(EXC[w]) return EXC[w];
  if(/(ion|dad|tad|tud|umbre|ie|sis)$/.test(w)) return 'f';
  if(/a$/.test(w)) return 'f';
  return 'm';
}
function guessG(name){
  const w = unacc(clean(name).split(' ')[0]||'');
  if(!w) return 'm';
  if(EXC[w]) return EXC[w];
  if(w.length>3 && /s$/.test(w) && !/(sis|is|us)$/.test(w)){
    let base=w.slice(0,-1);
    const b2=w.slice(0,-2);
    if(/es$/.test(w) && /[dnrlzjy]$/.test(b2)) base=b2;
    return genderSing(base)+'p';
  }
  return genderSing(w);
}
const ART={m:'el',f:'la',mp:'los',fp:'las'};
function NP(x){
  const g = (x.g && x.g!=='auto') ? x.g : guessG(x.name);
  const name = lowerFirst(x.name);
  return {g, name, art:ART[g], pl:g.endsWith('p'), raw:clean(x.name)};
}
const A  = x => { const n=NP(x); return n.art+' '+n.name; };          // el clima organizacional
const Acap = x => cap(A(x));
const DE = x => { const n=NP(x); return n.art==='el' ? 'del '+n.name : 'de '+n.art+' '+n.name; };
const verb = (x, sg, pl) => NP(x).pl ? pl : sg;
function dePhrase(s){ // "el hotel X" -> "del hotel X"
  s=clean(s); if(!s) return '';
  if(/^el\s/i.test(s)) return 'del '+s.slice(3);
  return 'de '+s;
}
function joinY(arr){ if(arr.length<=1) return arr.join(''); return arr.slice(0,-1).join(', ')+' y '+arr[arr.length-1]; }
function ctx(){
  const parts=[];
  if(clean(S.pob)) parts.push(dePhrase(S.pob));
  if(clean(S.org)) parts.push(dePhrase(S.org));
  let c=parts.join(' ');
  if(clean(S.lugar)) c+=', '+clean(S.lugar);
  if(clean(S.anio)) c+=', '+clean(S.anio);
  return c;
}
const lines = s => String(s||'').split(/\n|;/).map(clean).filter(Boolean);
const end = s => /[.?!]$/.test(s) ? s : s+'.';
const pobArt = () => { const p=clean(S.pob); if(/^las\s/i.test(p)) return 'cada una de '+p; if(/^(los|la|el)\s/i.test(p)) return 'cada uno de '+p.replace(/^el\s/i,'el '); return 'cada integrante de '+p; };

const isMed = () => S.alcance==='explicativo' && S.modelo==='mediador';
const filled = x => clean(x.name).length>0;
function dimsOf(v){ return v.dims.filter(filled); }

/* Constructos para tablas y figuras */
function constructs(){
  if(isMed()){
    const out = S.factores.filter(filled).map((f,i)=>({role:'Exógena',key:'F'+(i+1),x:f,ind:lines(f.ind)}));
    out.push({role:'Mediadora (endógena)',key:'M',x:S.med,ind:lines(S.med.ind)});
    out.push({role:'Endógena (dependiente)',key:'Y',x:S.dep,ind:lines(S.dep.ind)});
    return out;
  }
  return null;
}

  BASES[key]=base;

}

function POH(){
  const c=ctx(); const R={pe:[],oe:[],he:[],h0e:[]};
  if(isMed()){
    const F=S.factores.filter(filled), M=S.med, Y=S.dep;
    R.pg=T('pg','¿Cuáles son los factores que influyen en '+A(M)+' y en '+A(Y)+' '+c+'?');
    R.og=T('og','Determinar los factores que influyen en '+A(M)+' y en '+A(Y)+' '+c+'.');
    R.hg=T('hg',cap(joinY(F.map(A)))+' influyen en '+A(M)+' y, a su vez, '+A(M)+' '+verb(M,'influye','influyen')+' en '+A(Y)+' '+c+'.');
    R.h0g=T('h0g',cap(joinY(F.map(A)))+' no influyen en '+A(M)+' ni '+A(M)+' '+verb(M,'influye','influyen')+' en '+A(Y)+' '+c+'.');
    const pairs=F.map(f=>[f,M]).concat([[M,Y]]);
    pairs.forEach(([a,b],i)=>{
      R.pe.push(T('pe'+i,'¿De qué manera '+verb(a,'influye','influyen')+' '+A(a)+' en '+A(b)+' '+c+'?'));
      R.oe.push(T('oe'+i,'Establecer la influencia '+DE(a)+' en '+A(b)+' '+c+'.'));
      R.he.push(T('he'+i,Acap(a)+' '+verb(a,'influye','influyen')+' de manera positiva y significativa en '+A(b)+' '+c+'.'));
      R.h0e.push(T('h0e'+i,Acap(a)+' no '+verb(a,'influye','influyen')+' significativamente en '+A(b)+' '+c+'.'));
    });
  } else if(S.alcance==='explicativo'){
    const V1=S.v1, V2=S.v2, D=dimsOf(V1);
    R.pg=T('pg','¿De qué manera '+verb(V1,'influye','influyen')+' '+A(V1)+' en '+A(V2)+' '+c+'?');
    R.og=T('og','Determinar la influencia '+DE(V1)+' en '+A(V2)+' '+c+'.');
    R.hg=T('hg',Acap(V1)+' '+verb(V1,'influye','influyen')+' de manera positiva y significativa en '+A(V2)+' '+c+'.');
    R.h0g=T('h0g',Acap(V1)+' no '+verb(V1,'influye','influyen')+' significativamente en '+A(V2)+' '+c+'.');
    D.forEach((d,i)=>{
      R.pe.push(T('pe'+i,'¿De qué manera '+verb(d,'influye','influyen')+' '+A(d)+' en '+A(V2)+' '+c+'?'));
      R.oe.push(T('oe'+i,'Establecer la influencia '+DE(d)+' en '+A(V2)+' '+c+'.'));
      R.he.push(T('he'+i,Acap(d)+' '+verb(d,'influye','influyen')+' de manera positiva y significativa en '+A(V2)+' '+c+'.'));
      R.h0e.push(T('h0e'+i,Acap(d)+' no '+verb(d,'influye','influyen')+' significativamente en '+A(V2)+' '+c+'.'));
    });
  } else {
    const V1=S.v1, V2=S.v2, D=dimsOf(V1);
    R.pg=T('pg','¿Qué relación existe entre '+A(V1)+' y '+A(V2)+' '+c+'?');
    R.og=T('og','Determinar la relación que existe entre '+A(V1)+' y '+A(V2)+' '+c+'.');
    R.hg=T('hg',Acap(V1)+' '+verb(V1,'se relaciona','se relacionan')+' significativamente con '+A(V2)+' '+c+'.');
    R.h0g=T('h0g',Acap(V1)+' no '+verb(V1,'se relaciona','se relacionan')+' significativamente con '+A(V2)+' '+c+'.');
    D.forEach((d,i)=>{
      R.pe.push(T('pe'+i,'¿Qué relación existe entre '+A(d)+' y '+A(V2)+' '+c+'?'));
      R.oe.push(T('oe'+i,'Establecer la relación que existe entre '+A(d)+' y '+A(V2)+' '+c+'.'));
      R.he.push(T('he'+i,Acap(d)+' '+verb(d,'se relaciona','se relacionan')+' significativamente con '+A(V2)+' '+c+'.'));
      R.h0e.push(T('h0e'+i,Acap(d)+' no '+verb(d,'se relaciona','se relacionan')+' significativamente con '+A(V2)+' '+c+'.'));
    });
  }
  return R;
}

const Z = {'90':1.645,'95':1.96,'99':2.576};
function sample(){
  const N=parseInt(S.N,10); if(!(N>0)) return null;
  if(S.censal) return {N,n:N,censal:true};
  const z=Z[S.conf]||1.96, e=parseFloat(S.e)||0.05, p=0.5, q=0.5;
  const raw=(N*z*z*p*q)/((N-1)*e*e+z*z*p*q);
  return {N,n:Math.ceil(raw),raw,z,e,p,q,censal:false};
}
function totalItems(){
  const k=parseInt(S.itemsInd,10)||1;
  let n=0;
  if(isMed()) constructs().forEach(c=>n+=c.ind.length*k);
  else [S.v1,S.v2].forEach(v=>dimsOf(v).forEach(d=>n+=lines(d.ind).length*k));
  return n;
}
function likertText(){
  return S.likert==='7'
    ? 'escala tipo Likert de siete puntos (1 = Totalmente en desacuerdo a 7 = Totalmente de acuerdo)'
    : 'escala tipo Likert de cinco puntos (1 = Totalmente en desacuerdo, 2 = En desacuerdo, 3 = Ni de acuerdo ni en desacuerdo, 4 = De acuerdo, 5 = Totalmente de acuerdo)';
}
function pls10(){ // regla de las 10 veces
  const k = isMed() ? S.factores.filter(filled).length : dimsOf(S.v1).length;
  return 10*Math.max(k,1);
}

function codeOf(name, used){
  const words=clean(name).split(' ').filter(w=>w.length>2||/^[A-Z]/.test(w));
  let c=(words.length>1?words.slice(0,3).map(w=>w[0]).join(''):clean(name).slice(0,3)).toUpperCase();
  c=unacc(c).toUpperCase()||'X';
  let k=c, i=2; while(used.has(k)){ k=c+i; i++; } used.add(k); return k;
}
function scaleCell(){
  return 'Ordinal<br>(Likert de 1 a '+S.likert+')';
}
function scaleNote(){
  return S.likert==='7' ? ' Escala: 1 = Totalmente en desacuerdo a 7 = Totalmente de acuerdo.'
    : ' Escala: 1 = Totalmente en desacuerdo, 2 = En desacuerdo, 3 = Ni de acuerdo ni en desacuerdo, 4 = De acuerdo, 5 = Totalmente de acuerdo.';
}
const PH = s => '<span style="color:#9a6b00">['+s+']</span>';
function defCell(x){ return clean(x.def) ? esc(end(clean(x.def))) : PH('Completar definición conceptual con cita APA del autor'); }

function opTable(){
  const k=parseInt(S.itemsInd,10)||1; let item=1;
  const rng = n => { const a=item, b=item+n-1; item+=n; return n<=0?'—':(a===b?String(a):a+'–'+b); };
  if(isMed()){
    const head=['Constructo','Tipo de variable','Definición conceptual','Indicadores','Ítems','Escala de medición'];
    const rows=[]; let indN=1;
    const cs=constructs();
    cs.forEach((c,ci)=>{
      const ind=c.ind.map(s=>(indN++)+'. '+esc(s)).join('<br>');
      const cells=[{h:'<b>'+esc(cap(NP(c.x).name))+'</b>'},{h:c.role},{h:defCell(c.x)},{h:ind||PH('Indicadores')},{h:rng(c.ind.length*k)}];
      if(ci===0) cells.push({h:scaleCell(),rs:cs.length});
      rows.push({cells,sep:ci>0});
    });
    return {head,rows,title:'Operacionalización de las variables'};
  }
  const head=['Variable','Definición conceptual','Definición operacional','Dimensiones','Indicadores','Ítems','Escala de medición'];
  const rows=[];
  [[S.v1,'Variable 1'],[S.v2,'Variable 2']].forEach(([v,lab],vi)=>{
    const D=dimsOf(v); if(!D.length) return;
    const op='La variable '+esc(NP(v).name)+' se medirá a través de sus dimensiones '+esc(joinY(D.map(d=>NP(d).name)))+', mediante un cuestionario con escala tipo Likert de '+(S.likert==='7'?'siete':'cinco')+' puntos.';
    D.forEach((d,di)=>{
      const ind=lines(d.ind);
      const cells=[];
      if(di===0){
        cells.push({h:'<b>'+lab+':</b><br>'+esc(cap(NP(v).name)),rs:D.length});
        cells.push({h:defCell(v),rs:D.length});
        cells.push({h:op,rs:D.length});
      }
      cells.push({h:esc(cap(NP(d).name))});
      cells.push({h:ind.length?ind.map(s=>'– '+esc(s)).join('<br>'):PH('Indicadores')});
      cells.push({h:rng(ind.length*k)});
      if(di===0) cells.push({h:scaleCell(),rs:D.length});
      rows.push({cells,sep:vi>0&&di===0});
    });
  });
  return {head,rows,title:'Operacionalización de las variables'};
}

function consTable(){
  const R=POH(); const smp=sample(); const corr=S.alcance==='correlacional';
  const list = (arr) => arr.map((s,i)=>(i+1)+'. '+esc(s)).join('<br><br>');
  const head=['Problemas','Objetivos','Hipótesis','Variables y dimensiones','Indicadores','Metodología'];
  let vcell='', icell='';
  if(isMed()){
    constructs().forEach(c=>{ vcell+='<b>'+esc(c.role)+':</b><br>'+esc(cap(NP(c.x).name))+'<br><br>'; icell+='<b>'+esc(cap(NP(c.x).name))+':</b><br>'+c.ind.map(s=>'– '+esc(s)).join('<br>')+'<br><br>'; });
  } else {
    [[S.v1,'Variable 1'],[S.v2,'Variable 2']].forEach(([v,lab])=>{
      vcell+='<b>'+lab+':</b> '+esc(cap(NP(v).name))+'<br>Dimensiones:<br>'+dimsOf(v).map(d=>'– '+esc(cap(NP(d).name))).join('<br>')+'<br><br>';
      dimsOf(v).forEach(d=>{ icell+='<b>'+esc(cap(NP(d).name))+':</b><br>'+lines(d.ind).map(s=>'– '+esc(s)).join('<br>')+'<br>'; });
      icell+='<br>';
    });
  }
  const met='<b>Enfoque:</b> cuantitativo<br><b>Tipo:</b> '+(S.tipo==='aplicada'?'aplicada':'básica')+'<br><b>Nivel:</b> '+(corr?'correlacional':'explicativo')+
    '<br><b>Diseño:</b> '+(isVara()?(corr?'descriptivo correlacional, de corte transversal<br>M: Ox – r – Oy':'explicativo no experimental, de corte transversal (PLS-SEM)'):(corr?'no experimental, transeccional correlacional<br>M: Ox – r – Oy':'no experimental, transeccional correlacional-causal (PLS-SEM)'))+
    '<br><b>Población:</b> '+(smp?smp.N:'[N]')+'<br><b>Muestra:</b> '+(smp?smp.n+(smp.censal?' (censal)':''):'[n]')+
    '<br><b>Técnica:</b> encuesta<br><b>Instrumento:</b> cuestionario (Likert de '+S.likert+' puntos)'+
    '<br><b>Análisis:</b> '+(corr?'SPSS; Rho de Spearman (p < 0,05)':'SmartPLS 4; PLS-SEM, bootstrapping (5000)')+
    '<br><b>Sustento metodológico:</b> '+esc(AU().short.replace(/, (\d{4})$/,' ($1)'));
  const rows=[
    {cells:[{h:'<b>Problema general</b><br>'+esc(R.pg)},{h:'<b>Objetivo general</b><br>'+esc(R.og)},{h:'<b>Hipótesis general</b><br>'+esc(R.hg)},{h:vcell,rs:2},{h:icell,rs:2},{h:met,rs:2}]},
    {cells:[{h:'<b>Problemas específicos</b><br>'+list(R.pe)},{h:'<b>Objetivos específicos</b><br>'+list(R.oe)},{h:'<b>Hipótesis específicas</b><br>'+list(R.he)}],sep:true}
  ];
  return {head,rows,title:'Matriz de consistencia',landscape:true};
}

/* Render tabla APA; word=true añade estilos en línea para Word */
function apaTable(model, word){
  const B='solid windowtext 1.0pt';
  const nrows=model.rows.length;
  // calcular qué celdas tocan la última fila
  const occ=[]; // [rowIndex] -> filled columns
  let html='<table class="apa" '+(word?'border="0" cellspacing="0" cellpadding="0" style="border-collapse:collapse;width:100%"':'')+'><thead><tr>';
  const W = model.landscape ? [17,17,17,15,17,17] : (model.head.length===7 ? [12,19,21,13,22,6,7] : [15,13,28,26,8,10]);
  model.head.forEach((h,i)=>{ html+='<th width="'+W[i]+'%"'+(word?' style="width:'+W[i]+'%;border-top:'+B+';border-bottom:'+B+';padding:3pt 4pt;font-family:\'Times New Roman\';font-size:'+(model.landscape?'9':'10')+'pt;text-align:center"':' style="width:'+W[i]+'%"')+'>'+h+'</th>'; });
  html+='</tr></thead><tbody>';
  const span=new Array(nrows).fill(0).map(()=>[]);
  model.rows.forEach((r,ri)=>{
    html+='<tr>';
    r.cells.forEach(c=>{
      const rs=c.rs||1; const last=(ri+rs-1)>=nrows-1;
      const cls=[]; if(last) cls.push('lb'); if(r.sep && !word) cls.push('sep');
      let st='';
      if(word){
        st=' style="padding:3pt 4pt;vertical-align:top;font-family:\'Times New Roman\';font-size:'+(model.landscape?'9':'10')+'pt;'+(last?'border-bottom:'+B+';':'')+(r.sep?'border-top:solid #BFBFBF 0.5pt;':'')+'"';
      }
      html+='<td'+(rs>1?' rowspan="'+rs+'"':'')+(cls.length&&!word?' class="'+cls.join(' ')+'"':'')+st+'>'+c.h+'</td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  return html;
}
function apaBlock(n, model, word){
  const nota='<i>Nota.</i> Elaboración propia con base en el marco teórico de la investigación.'+(n===1?scaleNote():'');
  if(word) return '<p class="tnum">Tabla '+n+'</p><p class="ttitle">'+model.title+'</p>'+apaTable(model,true)+'<p class="nota">'+nota+'</p>';
  return '<p class="tnum">Tabla '+n+'</p><p class="ttitle">'+model.title+'</p>'+apaTable(model,false)+'<p class="nota">'+nota+'</p>';
}

const COL={lat:'#dbe7f5',latS:'#1d3b63',ind:'#fff4cf',indS:'#a37b17',arr:'#1d3b63',txt:'#14213d',lab:'#8a5a00'};
function wrap(text, max){
  const words=clean(text).split(' '); const out=[]; let cur='';
  words.forEach(w=>{ if((cur+' '+w).trim().length>max && cur){ out.push(cur); cur=w; } else cur=(cur+' '+w).trim(); });
  if(cur) out.push(cur); return out.length?out:[''];
}
function svgText(x,y,text,max,opt={}){
  const L=wrap(text,max); const lh=opt.lh||14; const y0=y-(L.length-1)*lh/2;
  return '<text x="'+x+'" y="'+y0+'" text-anchor="'+(opt.anchor||'middle')+'" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="'+(opt.size||12)+'" font-weight="'+(opt.weight||'normal')+'" fill="'+(opt.fill||COL.txt)+'">'+
    L.map((l,i)=>'<tspan x="'+x+'" dy="'+(i?lh:0)+'">'+esc(l)+'</tspan>').join('')+'</text>';
}
function defsArrow(id){
  return '<defs><marker id="'+id+'e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="'+COL.arr+'"/></marker></defs>';
}
function line(x1,y1,x2,y2,id,both){
  return '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+COL.arr+'" stroke-width="1.5" marker-end="url(#'+id+'e)"'+(both?' marker-start="url(#'+id+'e)"':'')+'/>';
}
function edge(cx,cy,rx,ry,tx,ty){ const dx=tx-cx, dy=ty-cy; const t=1/Math.sqrt((dx/rx)**2+(dy/ry)**2); return [cx+dx*t, cy+dy*t]; }
function pill(x,y,t){ const w=t.length*7+12; return '<rect x="'+(x-w/2)+'" y="'+(y-10)+'" width="'+w+'" height="20" rx="10" fill="#fff" stroke="'+COL.lab+'" stroke-width="1"/>'+svgText(x,y,t,20,{size:11,weight:'bold',fill:COL.lab}); }
function latent(cx,cy,name,rx=92,ry=34){ return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+COL.lat+'" stroke="'+COL.latS+'" stroke-width="1.6"/>'+svgText(cx,cy,cap(name),18,{weight:'bold',size:12}); }
function indRect(x,y,w,label){ return '<rect x="'+x+'" y="'+(y-11)+'" width="'+w+'" height="22" rx="3" fill="'+COL.ind+'" stroke="'+COL.indS+'" stroke-width="1"/>'+svgText(x+w/2,y,label,14,{size:11}); }

/* Modelo explicativo (PLS-SEM) */
function figExplicativo(id){
  const used=new Set();
  let exo, end1, mid=null;
  if(isMed()){
    exo=S.factores.filter(filled).map(f=>({name:NP(f).name,code:codeOf(f.name,used),ind:lines(f.ind)}));
    mid={name:NP(S.med).name,code:codeOf(S.med.name,used),ind:lines(S.med.ind)};
    end1={name:NP(S.dep).name,code:codeOf(S.dep.name,used),ind:lines(S.dep.ind)};
  } else {
    exo=dimsOf(S.v1).map(d=>({name:NP(d).name,code:codeOf(d.name,used),ind:lines(d.ind)}));
    const allInd=[]; dimsOf(S.v2).forEach(d=>lines(d.ind).forEach(s=>allInd.push(s)));
    end1={name:NP(S.v2).name,code:codeOf(S.v2.name,used),ind:allInd};
  }
  const IW=64, RH=28;
  let y=30; const ex=270;
  const blocks=exo.map(b=>{ const h=Math.max(90, b.ind.length*RH+20); const cy=y+h/2; y+=h+10; return {...b,cy}; });
  let H=y+10;
  const midX=isMed()?600:0, endX=isMed()?860:660;
  const cY=(blocks[0].cy+blocks[blocks.length-1].cy)/2;
  if(isMed()) H=Math.max(H, cY+70+mid.ind.length*RH+20);
  H=Math.max(H, cY+end1.ind.length*RH/2+40);
  const W=isMed()?1060:850;
  let s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+defsArrow(id)+'<rect width="'+W+'" height="'+H+'" fill="#fff"/>';
  // exógenas con indicadores a la izquierda
  blocks.forEach(b=>{
    b.ind.forEach((t,i)=>{ const iy=b.cy-(b.ind.length-1)*RH/2+i*RH; s+=indRect(20,iy,IW,b.code+(i+1)); const p=edge(ex,b.cy,92,34,20+IW,iy); s+=line(p[0],p[1],20+IW+2,iy,id); });
    s+=latent(ex,b.cy,b.name);
  });
  const target = isMed()? {x:midX,y:cY} : {x:endX,y:cY};
  blocks.forEach((b,i)=>{
    const a=edge(ex,b.cy,92,34,target.x,target.y), z=edge(target.x,target.y,92,34,ex,b.cy);
    s+=line(a[0],a[1],z[0],z[1],id);
    s+=pill(a[0]+(z[0]-a[0])*.45, a[1]+(z[1]-a[1])*.45, 'H'+(i+1));
  });
  if(isMed()){
    mid.ind.forEach((t,i)=>{ const iy=cY+70+i*RH; s+=indRect(midX-IW/2,iy,IW,mid.code+(i+1)); });
    if(mid.ind.length){ s+=line(midX,cY+34,midX,cY+70-13,id); }
    for(let i=1;i<mid.ind.length;i++){ /* indicadores apilados: conector vertical */ }
    s+=latent(midX,cY,mid.name);
    s+=line(midX+92,cY,endX-94,cY,id);
    s+=pill((midX+92+endX-94)/2,cY,'H'+(blocks.length+1));
  }
  // endógena con indicadores a la derecha
  const ix=endX+130;
  end1.ind.forEach((t,i)=>{ const iy=cY-(end1.ind.length-1)*RH/2+i*RH; s+=indRect(ix,iy,IW,end1.code+(i+1)); const p=edge(endX,cY,92,34,ix,iy); s+=line(p[0],p[1],ix-2,iy,id); });
  s+=latent(endX,cY,end1.name);
  s+='</svg>';
  return {svg:s,W,H,codes:[...blocks,...(mid?[mid]:[]),end1]};
}

/* Modelo teórico correlacional */
function figCorrModel(id){
  const D1=dimsOf(S.v1), D2=dimsOf(S.v2);
  const RH=58, top=70; const H=Math.max(top+D1.length*RH+30, 280); const W=820;
  let s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+defsArrow(id)+'<rect width="'+W+'" height="'+H+'" fill="#fff"/>';
  s+='<rect x="20" y="16" width="270" height="'+(H-32)+'" rx="12" fill="#f3f7fc" stroke="'+COL.latS+'" stroke-dasharray="5 4"/>';
  s+=svgText(155,38,'V1: '+cap(NP(S.v1).name),34,{weight:'bold',size:13});
  const by=(H)/2; const bh=Math.max(120, D2.length*20+60);
  s+='<rect x="540" y="'+(by-bh/2)+'" width="260" height="'+bh+'" rx="12" fill="'+COL.lat+'" stroke="'+COL.latS+'" stroke-width="1.6"/>';
  s+=svgText(670,by-bh/2+24,'V2: '+cap(NP(S.v2).name),30,{weight:'bold',size:13});
  D2.forEach((d,i)=>{ s+=svgText(670,by-bh/2+56+i*20,'• '+cap(NP(d).name),34,{size:12}); });
  s+=line(292,38,538,by-bh/2+24,id,true); s+=pill(415,(38+by-bh/2+24)/2-10,'HG');
  D1.forEach((d,i)=>{
    const cy=top+i*RH+RH/2;
    s+='<rect x="45" y="'+(cy-20)+'" width="220" height="40" rx="8" fill="#fff" stroke="'+COL.latS+'" stroke-width="1.3"/>';
    s+=svgText(155,cy,cap(NP(d).name),30,{size:12});
    s+=line(267,cy,538,by+(i-(D1.length-1)/2)*14,id,true);
    s+=pill(400,cy+(by+(i-(D1.length-1)/2)*14-cy)*.49,'H'+(i+1));
  });
  s+='</svg>'; return {svg:s,W,H};
}

function svgToPng(svg,W,H,scale=2){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{ const c=document.createElement('canvas'); c.width=W*scale; c.height=H*scale; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/png')); };
    img.onerror=rej;
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}

/* ============================================================
   VALIDACIÓN POR PASO
   ============================================================ */
function issues(step){
  const out=[];
  if(step===0){ if(!S.alcance) out.push('Elige el alcance de la investigación (correlacional o explicativo).'); }
  if(step===1){
    if(isMed()){
      const F=S.factores.filter(filled);
      if(F.length<2) out.push('Registra al menos 2 factores (variables exógenas).');
      F.forEach((f,i)=>{ if(!lines(f.ind).length) out.push('El factor "'+clean(f.name)+'" necesita al menos un indicador.'); });
      if(!filled(S.med)) out.push('Escribe el nombre de la variable mediadora.'); else if(!lines(S.med.ind).length) out.push('La variable mediadora necesita indicadores.');
      if(!filled(S.dep)) out.push('Escribe el nombre de la variable dependiente.'); else if(!lines(S.dep.ind).length) out.push('La variable dependiente necesita indicadores.');
    } else {
      [[S.v1,'Variable 1',2],[S.v2,'Variable 2',1]].forEach(([v,l,min])=>{
        if(!filled(v)) out.push('Escribe el nombre de la '+l+'.');
        const D=dimsOf(v); if(D.length<min) out.push('La '+l+' necesita al menos '+min+' dimensi'+(min>1?'ones':'ón')+'.');
        D.forEach(d=>{ if(!lines(d.ind).length) out.push('La dimensión "'+clean(d.name)+'" necesita al menos un indicador.'); });
      });
    }
  }
  if(step===2){
    if(!clean(S.pob)) out.push('Indica la población o unidad de estudio (p. ej., "los colaboradores").');
    if(!clean(S.org)) out.push('Indica la organización, empresa o rubro.');
    if(!clean(S.lugar)) out.push('Indica el lugar.');
    if(!/^\d{4}$/.test(clean(S.anio))) out.push('Indica el año con 4 dígitos.');
  }
  if(step===4){ if(!(parseInt(S.N,10)>0)) out.push('Indica el tamaño de la población (N).'); }
  return out;
}
function firstInvalid(){ for(let i=0;i<STEPS.length;i++){ if(issues(i).length) return i; } return STEPS.length; }

  const items = isMed() ? [['Variable mediadora',NP(S.med).name],['Variable dependiente',NP(S.dep).name]] : [['Variable 1',NP(S.v1).name],['Variable 2',NP(S.v2).name]];

main.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.k){ // texto editable
    const k=el.dataset.k, txt=el.innerText.replace(/\s+/g,' ').trim();
    if(txt && txt!==BASES[k]) S.ov[k]={base:BASES[k],text:txt}; else delete S.ov[k];
    el.classList.toggle('mod',!!S.ov[k]); el.parentElement.classList.toggle('has-mod',!!S.ov[k]);
    save(); return;
  }
  if(!el.dataset.b) return;
  if(el.dataset.te){ S.titulo=el.value; S.tituloEdited=true; save(); refreshLive(); return; }
  const v = el.type==='checkbox' ? el.checked : el.value;
  setPath(el.dataset.b, v);
  if(el.dataset.b==='alcance'){ if(v==='correlacional') S.modelo='estandar'; S.tipo = v==='explicativo'?'aplicada':S.tipo; }
  save();
  if(el.dataset.rr || el.type==='radio' || el.type==='checkbox') render(false); else refreshLive();
});

main.addEventListener('paste',e=>{ if(e.target.closest && e.target.closest('.ed')){ e.preventDefault(); const t=(e.clipboardData||window.clipboardData).getData('text/plain'); document.execCommand('insertText',false,t.replace(/\s+/g,' ')); } });

document.addEventListener('click',async e=>{
  const go=e.target.closest('[data-go]'); if(go && !go.disabled){ S.step=+go.dataset.go; save(); render(true); return; }
  const b=e.target.closest('[data-act],[data-copy]'); if(!b) return;
  const a=b.dataset.act;
  if(b.dataset.copy) return doCopy(b.dataset.copy);
  if(a==='next'){ const is=issues(S.step); if(is.length){ showIssues(is); return; } S.step=Math.min(S.step+1,STEPS.length-1); save(); render(true); }
  else if(a==='prev'){ S.step=Math.max(0,S.step-1); save(); render(true); }
  else if(a==='adddim'){ getPath(b.dataset.p).dims.push({name:'',g:'auto',ind:''}); save(); render(false); }
  else if(a==='deldim'){ getPath(b.dataset.p).dims.splice(+b.dataset.i,1); save(); render(false); }
  else if(a==='addf'){ S.factores.push(blankCons()); save(); render(false); }
  else if(a==='delf'){ S.factores.splice(+b.dataset.i,1); save(); render(false); }
  else if(a==='tsel'){ e.preventDefault(); S.tituloSel=+b.dataset.i; S.tituloEdited=false; S.titulo=''; save(); render(false); }
  else if(a==='tReset'){ S.tituloEdited=false; S.titulo=''; save(); render(false); }
  else if(a==='rst'){ delete S.ov[b.dataset.k]; save(); render(false); }
  else if(a==='example'){ loadExample(); }
  else if(a==='png'){ const f=figures()[+b.dataset.f]; const url=await svgToPng(f.svg,f.W,f.H,2); dl(url,'Figura_'+f.n+'.png'); toast('Figura descargada'); }
  else if(a==='docAll'){ await exportDoc('all'); }
  else if(a==='docT1'){ await exportDoc('t1'); }
  else if(a==='docT2'){ await exportDoc('t2'); }
  else if(a==='saveFile'){ saveFile(); }
});

/* Copiar */
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2200); }
async function copyRich(html, text){
  try{
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);
      return true;
    }
  }catch(e){}
  const d=document.createElement('div'); d.innerHTML=html; d.style.cssText='position:fixed;left:-9999px;top:0;background:#fff'; document.body.appendChild(d);
  const r=document.createRange(); r.selectNodeContents(d); const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  s.removeAllRanges(); d.remove(); return ok;
}

    s1+='<h1>I. PLANTEAMIENTO DEL PROBLEMA</h1><h2>1.1. Formulación del problema</h2><h3>Problema general</h3><p>'+esc(P.pg)+'</p><h3>Problemas específicos</h3>'+P.pe.map((x,i)=>'<p class="li">'+(i+1)+'. '+esc(x)+'</p>').join('');
    s1+='<h2>1.2. Objetivos</h2><h3>1.2.1. Objetivo general</h3><p>'+esc(P.og)+'</p><h3>1.2.2. Objetivos específicos</h3>'+P.oe.map((x,i)=>'<p class="li">'+(i+1)+'. '+esc(x)+'</p>').join('');
    s1+='<h1>II. MARCO TEÓRICO</h1><h2>2.4. Hipótesis</h2><h3>2.4.1. Hipótesis general</h3><p>'+esc(P.hg)+'</p><h3>2.4.2. Hipótesis específicas</h3>'+P.he.map((x,i)=>'<p class="li">H'+(i+1)+'. '+esc(x)+'</p>').join('');
    if(S.showH0) s1+='<h3>Hipótesis nulas</h3><p class="li">H₀. '+esc(P.h0g)+'</p>'+P.h0e.map((x,i)=>'<p class="li">H₀'+(i+1)+'. '+esc(x)+'</p>').join('');
    s1+='<h2>2.5. Variables</h2><h3>2.5.1. Operacionalización de variables</h3>'+apaBlock(1,opTable(),true);
    s1+='<h1>III. METODOLOGÍA</h1>';
    const figs=figures();
    for(const [t,k] of METH_ORDER){
      if(k==='pob') s1+='<h2>3.5. Población y muestra</h2>';
      s1+=(k==='pob'||k==='mue'?'<h3>':'<h2>')+t+(k==='pob'||k==='mue'?'</h3>':'</h2>')+'<p>'+esc(M[k])+'</p>';
      if(k==='mue'){ const smp=sample(); if(smp && !smp.censal) s1+='<p class="np" style="text-align:center"><i>n</i> = <i>N</i>·<i>Z</i>²·<i>p</i>·<i>q</i> / [(<i>N</i> − 1)·<i>e</i>² + <i>Z</i>²·<i>p</i>·<i>q</i>] = '+smp.n+'</p>'; }
      if(k==='diseno'){ for(const f of figs) s1+=await figHtml(f); }
    }
    s1+='<h1>V. REFERENCIAS</h1>'+refsFor().map(r=>'<p class="ref">'+refHtml(r)+'</p>').join('');
    s2='<h1>VI. ANEXOS</h1><h2>6.1. Matriz de consistencia</h2>'+apaBlock(2,consTable(),true);
  } else if(which==='t1'){ s1=apaBlock(1,opTable(),true); }
  else { s2=apaBlock(2,consTable(),true); }

  const css='@page WordSection1{size:21.0cm 29.7cm;margin:2.54cm 2.54cm 2.54cm 2.54cm;mso-header-margin:35.4pt;mso-footer-margin:35.4pt;}div.WordSection1{page:WordSection1;}'+
    '@page WordSection2{size:29.7cm 21.0cm;mso-page-orientation:landscape;margin:2.54cm 2.54cm 2.54cm 2.54cm;}div.WordSection2{page:WordSection2;}'+
    'body{font-family:"Times New Roman";font-size:12pt;}p{margin:0;font-family:"Times New Roman";font-size:12pt;line-height:200%;text-indent:1.27cm;text-align:left;}'+
    'p.np,p.li,p.tnum,p.ttitle,p.nota,p.title{text-indent:0;}p.li{margin-left:1.27cm;text-indent:-0.63cm;}'+
    'p.title{text-align:center;font-weight:bold;margin-bottom:12pt;}p.tnum{font-weight:bold;margin-top:12pt;}p.ttitle{font-style:italic;}p.nota{margin-bottom:12pt;}'+
    'p.ref{margin-left:1.27cm;text-indent:-1.27cm;}'+
    'h1{font-family:"Times New Roman";font-size:12pt;font-weight:bold;text-align:center;margin:12pt 0 0 0;line-height:200%;}'+
    'h2{font-family:"Times New Roman";font-size:12pt;font-weight:bold;text-align:left;margin:0;line-height:200%;}'+
    'h3{font-family:"Times New Roman";font-size:12pt;font-weight:bold;font-style:italic;text-align:left;margin:0;line-height:200%;}'+
    'table.apa td p, table.apa th p{line-height:115%;text-indent:0;}a{color:#0563C1;text-decoration:underline;}';
  let body='';
  if(s1) body+='<div class="WordSection1">'+s1+'</div>';
  if(s1 && s2) body+='<br clear="all" style="page-break-before:always;mso-break-type:section-break">';
  if(s2) body+='<div class="WordSection2">'+s2+'</div>';
  const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><title>'+esc(getTitle())+'</title><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]--><style>'+css+'</style></head><body lang="ES-PE">'+body+'</body></html>';

  const B='----=_NextPart_TITULADORA_POH';
  const b64=str=>{ const bytes=new TextEncoder().encode(str); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(bin); };
  const fold=s=>s.replace(/.{1,76}/g,'$&\r\n');
  let mht='MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="'+B+'"; type="text/html"\r\n\r\n';
  mht+='--'+B+'\r\nContent-Type: text/html; charset="utf-8"\r\nContent-Transfer-Encoding: base64\r\nContent-Location: file:///C:/tituladora/documento.htm\r\n\r\n'+fold(b64(html))+'\r\n';
  imgs.forEach(im=>{ mht+='--'+B+'\r\nContent-Type: image/png\r\nContent-Transfer-Encoding: base64\r\nContent-Location: file:///C:/tituladora/'+im.name+'\r\n\r\n'+fold(im.b64)+'\r\n'; });

  const name=(which==='all'?'POH_':which==='t1'?'Tabla1_Operacionalizacion_':'Tabla2_Matriz_consistencia_')+slug(getTitle())+'.doc';
  dl(URL.createObjectURL(new Blob([mht],{type:'application/msword'})),name);

/* ============================================================

   ============================================================ */
function saveFile(){
  const blob=new Blob([JSON.stringify({app:'tituladora-poh-unasam',version:1,fecha:new Date().toISOString(),data:S},null,2)],{type:'application/json'});
  dl(URL.createObjectURL(blob),'sesion_'+slug(getTitleSafe())+'.json'); toast('Sesión guardada como archivo');
}
function getTitleSafe(){ try{ return S.alcance?getTitle():'tesis'; }catch(e){ return 'tesis'; } }
$('#bSave').onclick=saveFile;
$('#bOpen').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const j=JSON.parse(r.result); if(j.app!=='tituladora-poh-unasam'||!j.data) throw 0; S=merge(defaults(),j.data); save(); render(true); toast('Sesión abierta'); }catch(err){ toast('El archivo no es una sesión válida de esta app'); } e.target.value=''; };
  r.readAsText(f);
};
$('#bNew').onclick=()=>{ if(confirm('¿Empezar un proyecto nuevo? Se borrará la sesión actual de este navegador (guárdala antes como archivo si la necesitas).')){ S=defaults(); save(); render(true); toast('Proyecto nuevo'); } };
function loadExample(){
  if((filled(S.v1)||filled(S.med)) && !confirm('Se reemplazarán los datos actuales por un ejemplo. ¿Continuar?')) return;
  const keep=S.alcance||'explicativo', mod=S.modelo;
  S=defaults(); S.alcance=keep; S.modelo=keep==='explicativo'?mod:'estandar'; S.tipo=keep==='explicativo'?'aplicada':'basica';
  S.pob='los colaboradores'; S.org='la Municipalidad Provincial de Huaraz'; S.lugar='Huaraz'; S.N='180';
  if(isMed()){
    S.factores=[
      {name:'Liderazgo transformacional',g:'auto',def:'',ind:'Influencia idealizada\nMotivación inspiradora\nEstimulación intelectual\nConsideración individual'},
      {name:'Comunicación interna',g:'auto',def:'',ind:'Claridad de la información\nOportunidad de la información\nCanales de comunicación'},
      {name:'Reconocimiento laboral',g:'auto',def:'',ind:'Reconocimiento verbal\nIncentivos\nOportunidades de desarrollo'}];
    S.med={name:'Satisfacción laboral',g:'auto',def:'',ind:'Satisfacción con el trabajo\nSatisfacción con el entorno\nSatisfacción con la supervisión'};
    S.dep={name:'Desempeño laboral',g:'auto',def:'',ind:'Cumplimiento de metas\nCalidad del trabajo\nIniciativa\nTrabajo en equipo'};
  } else {
    S.v1={name:'Clima organizacional',g:'auto',def:'',dims:[
      {name:'Comunicación',g:'auto',ind:'Comunicación horizontal\nComunicación vertical\nCanales de comunicación'},
      {name:'Liderazgo',g:'auto',ind:'Estilo de dirección\nToma de decisiones\nApoyo del jefe'},
      {name:'Condiciones laborales',g:'auto',ind:'Ambiente físico\nRecursos y materiales\nSeguridad en el trabajo'}]};
    S.v2={name:'Desempeño laboral',g:'auto',def:'',dims:[
      {name:'Productividad',g:'auto',ind:'Cumplimiento de metas\nUso eficiente del tiempo'},
      {name:'Calidad del trabajo',g:'auto',ind:'Precisión\nAtención al usuario'},
      {name:'Compromiso',g:'auto',ind:'Identificación institucional\nIniciativa'}]};
  }
  S.step=1; save(); render(true); toast('Ejemplo cargado: revisa y reemplaza con tus datos');
}
